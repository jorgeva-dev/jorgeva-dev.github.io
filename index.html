<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jorge Avalles — Aplicaciones Android</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    color: #1f2328;
    background: #fff;
    display: flex;
    justify-content: center;
    padding: 3rem 1.25rem;
  }
  main { max-width: 34rem; width: 100%; }
  h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
  .sub { color: #59636e; margin: 0 0 2.5rem; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: #59636e; margin: 2.5rem 0 .75rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    border: 1px solid #d1d9e0;
    border-radius: 10px;
    padding: .9rem 1.1rem;
    margin-bottom: .6rem;
  }
  .name { font-weight: 600; }
  .pkg { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; color: #59636e; }
  a { color: #0969da; }
  footer { margin-top: 3rem; font-size: .85rem; color: #59636e; border-top: 1px solid #d1d9e0; padding-top: 1rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; color: #e6edf3; }
    .sub, h2, .pkg, footer { color: #9198a1; }
    li, footer { border-color: #3d444d; }
    a { color: #4493f8; }
  }
</style>
</head>
<body>
<main>
  <h1>Jorge Avalles</h1>
  <p class="sub">Desarrollador de aplicaciones Android.</p>

  <h2>Aplicaciones</h2>
  <ul>
    <li>
      <div class="name">NapStop</div>
      <div class="pkg">com.jorgeva.napstop</div>
    </li>
    <li>
      <div class="name">QuickNote</div>
      <div class="pkg">com.jorgeva.quicknote</div>
    </li>
    <li>
      <div class="name">Adivina la Palabra</div>
      <div class="pkg">com.jorgeavalles.adivinalapalabra</div>
    </li>
  </ul>

  <h2>Contacto</h2>
  <p><a href="mailto:jorgeavalles@gmail.com">jorgeavalles@gmail.com</a></p>

  <footer>
    Sitio del desarrollador. Consulta el archivo
    <a href="/app-ads.txt">app-ads.txt</a>.
  </footer>
</main>
</body>
</html>
